<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corta Aí</title>
    <link rel="icon" type="image/png" href="img/miniLogo.png">
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>
    <div id="ladoEsquerdo">
        <img src="img/logo.png" alt="Logo da empresa" id="logoPrincipal">
    </div>
    <div id="ladoDireito">
        <form>
            <span id="textoCriarConta">Criar Conta</span>
            <span id="textoCadastreSe">Cadastre-se</span>
            <input type="text" placeholder="Nome" required id="inputNome">
            <input type="email" placeholder="Email" required id="inputEmail">
            <input type="password" placeholder="Senha" required id="inputSenha">
            <button id="cadastrar" type="button">Cadastrar</button>
            <span id="jaCadastro">Já tem um cadastro? <a href="login.html">Login</a></span>
        </form>
    </div>

    <script src="js/cadastro.js"></script>
</body>

</html>
