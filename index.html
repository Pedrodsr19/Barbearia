<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corta Aí</title>
    <link rel="icon" type="image/png" href="img/miniLogo.png">
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>
    <form>
        <img src="img/logo.png" alt="Logo da empresa" id="logoPrincipal">
        <input type="text" placeholder="Nome" required id="inputNome">

        <button id="cadastrar" type="button">Cadastrar</button>
        <span>Já tem um cadastro? <a href="login.html">Login</a></span>
    </form>

    <script src="js/cadastro.js"></script>

</html>
